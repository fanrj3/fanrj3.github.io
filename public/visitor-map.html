<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_blank">
  <style>
    html,
    body {
      width: 260px;
      height: 180px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body,
    #placeholder,
    #fallback,
    #live-map {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #placeholder,
    #fallback,
    #live-map {
      position: absolute;
      inset: 0;
    }

    #placeholder {
      z-index: 0;
    }

    #placeholder img {
      display: block;
      width: 132px;
      height: 132px;
      object-fit: contain;
      opacity: 0.72;
    }

    #fallback {
      z-index: 1;
    }

    #fallback[hidden] {
      display: none;
    }

    #fallback img,
    #live-map img,
    #live-map canvas,
    #live-map svg {
      display: block;
      width: 260px !important;
      max-width: 260px !important;
      max-height: 180px !important;
      object-fit: contain;
    }

    #live-map {
      z-index: 2;
    }
  </style>
</head>
<body>
  <div id="placeholder" aria-hidden="true">
    <img src="/visitor-map-placeholder.png" alt="">
  </div>
  <a id="fallback" href="https://mapmyvisitors.com/web/1c77x" title="Visit tracker" hidden>
    <img
      data-src="https://mapmyvisitors.com/map.png?d=DUL8m5FIImXTTjTLFo8NNR1TYiJgTBa4VkQaSy_Yck4&cl=ffffff"
      alt=""
    >
  </a>
  <div id="live-map">
    <script
      type="text/javascript"
      id="mapmyvisitors"
      src="https://mapmyvisitors.com/map.js?d=DUL8m5FIImXTTjTLFo8NNR1TYiJgTBa4VkQaSy_Yck4&cl=ffffff&w=a"
    ></script>
  </div>
  <script>
    const fallback = document.getElementById('fallback');
    const fallbackImage = fallback.querySelector('img');
    const liveMap = document.getElementById('live-map');
    let fallbackTimer;

    const hasLiveMap = () => Boolean(liveMap.querySelector('a, canvas, iframe, img, svg'));
    const showFallback = () => {
      if (hasLiveMap()) return;
      fallbackImage.src = fallbackImage.dataset.src;
      fallback.hidden = false;
    };
    const checkLiveMap = () => {
      if (!hasLiveMap()) return;
      liveMap.querySelectorAll('img').forEach((image) => {
        image.addEventListener('error', () => {
          image.closest('a')?.remove();
          image.remove();
          showFallback();
        }, { once: true });
      });
      clearTimeout(fallbackTimer);
      fallback.hidden = true;
    };

    fallbackImage.addEventListener('error', () => {
      fallback.hidden = true;
      fallbackImage.remove();
    }, { once: true });

    new MutationObserver(checkLiveMap).observe(liveMap, { childList: true, subtree: true });
    checkLiveMap();
    fallbackTimer = setTimeout(showFallback, 4000);
  </script>
</body>
</html>
